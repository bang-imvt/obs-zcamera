ZCameraPlugin.SourceProps.AiOverlayTip="把相机 AI 检测到的人、头、脸以红色方框叠加在该源画面上，便于在取景时看清相机正在锁定谁。必须先开启相机自身的检测，而只有相机能开：打开 Dock 的「自动构图」页，点「启用」（或者开启人脸自动对焦）。检测运行中该页顶部会显示「正在检测」；检测关闭时相机不上报任何目标，也就没有方框可画。相机停止上报后约一秒，方框自动消失；方框出现的位置由下面一项决定。"
ZCameraPlugin.SourceProps.AiOverlayWhere="显示位置"
ZCameraPlugin.SourceProps.AiOverlayWhereTip="红色方框允许出现的位置。「仅监看窗口」是默认值：只在单独渲染该源的通道里绘制，也就是上面的属性预览、滤镜与交互对话框、窗口投影仪或 Studio 模式的预览窗口，因此不会进入节目输出，也就不会录进画面或推流。OBS 的主预览窗口永远复制节目画面，任何设置都无法只让它显示方框而不录进去；要看实时方框请用 Dock「自动构图」页的「监看窗口」按钮。「预览与录制」把方框直接画进画面本身，和相机自带网页一样，于是这个源渲染到哪里它就出现在哪里——包括录制和推流文件。"
