ZCameraPlugin.SourceProps.HWAccel="Decode Backend"
ZCameraPlugin.SourceProps.AiOverlay="Draw AI detection boxes"
ZCameraPlugin.SourceProps.AiOverlayTip="Draws the people, heads and faces the camera's AI is detecting as red rectangles over this source's picture, so the operator can see what the camera is locking onto while framing the shot. The camera's own detection has to be running first, and only the camera can start it: open the dock's Auto framing tab and press Enable (or switch on face autofocus). The status word there reads Detecting while it runs; with detection off the camera sends nothing to draw. The boxes clear about a second after the camera stops reporting, and where they are allowed to appear is set just below."
ZCameraPlugin.SourceProps.AiOverlayWhere="Show them in"
ZCameraPlugin.SourceProps.AiOverlayWhereTip="Where the red rectangles are allowed to appear. \"Monitor panes only\" is the default and keeps them out of the program output, and therefore out of the recording and the stream, by drawing them only in a pass that renders this source on its own: the Properties preview above, the Filters and Interaction dialogs, a Windowed Projector, or the Studio Mode preview pane. OBS's main preview pane always copies the program picture, so no setting can put the boxes there without also recording them; to watch them live, use the Monitor window button on the dock's Auto framing tab. \"Preview and recording\" paints them into the picture itself, the way the camera's own web page does, so they then appear everywhere this source is rendered - including the recording and the stream."
ZCameraPlugin.AiOverlayWhere.Program="Preview and recording"
ZCameraPlugin.AiOverlayWhere.Monitor="Monitor panes only (not recorded)"
