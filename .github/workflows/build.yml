# GitHub Actions build for obs-zcamera (Windows / macOS / Linux).
#
# Builds the OBS plugin for all three platforms and uploads the artifacts so a
# macOS bundle / Windows installer / Linux package can be produced without a
# local machine of each OS.
#
# The plugin links OBS's own libobs/obs-frontend-api (from the published
# obsproject/obs-deps) and OBS's patched Qt6 (the *-qt6-* packages, so the ABI
# matches the OBS it runs in). Linux has no published obs-deps, so it builds
# against the distro's libobs-dev instead.
#
# NOTE: the obs-deps asset names here are the real ones for tag 2024-09-12
# (windows-deps-* / macos-deps-*). If a download 404s, re-check the tag's assets.

name: Build

on:
  push:
    branches: [main]
    tags: ["*"]
  pull_request:
    branches: [main]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            artifact: windows
            deps: windows-deps-2024-09-12-x64.zip
            qt: windows-deps-qt6-2024-09-12-x64.zip
          - os: macos-13
            artifact: macos
            deps: macos-deps-2024-09-12-universal.tar.xz
            qt: macos-deps-qt6-2024-09-12-universal.tar.xz
          - os: ubuntu-22.04
            artifact: linux
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build \
            libobs-dev qt6-base-dev \
            libavcodec-dev libavutil-dev libswscale-dev

      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'

      - name: Download OBS deps (Windows/macOS)
        if: runner.os != 'Linux'
        shell: bash
        run: |
          set -e
          DEPS="$RUNNER_TEMP/obs-deps"
          mkdir -p "$DEPS"
          # libobs / obs-frontend-api / FFmpeg
          curl -fL \
            "https://github.com/obsproject/obs-deps/releases/download/2024-09-12/${{ matrix.deps }}" \
            -o "$RUNNER_TEMP/deps.pkg"
          if [[ "${{ matrix.deps }}" == *.zip ]]; then
            unzip -q "$RUNNER_TEMP/deps.pkg" -d "$DEPS"
          else
            tar -xJf "$RUNNER_TEMP/deps.pkg" -C "$DEPS"
          fi
          # OBS's patched Qt6 (ABI-matching)
          curl -fL \
            "https://github.com/obsproject/obs-deps/releases/download/2024-09-12/${{ matrix.qt }}" \
            -o "$RUNNER_TEMP/qt.pkg"
          if [[ "${{ matrix.qt }}" == *.zip ]]; then
            unzip -q "$RUNNER_TEMP/qt.pkg" -d "$DEPS"
          else
            tar -xJf "$RUNNER_TEMP/qt.pkg" -C "$DEPS"
          fi
          echo "OBS_DEPS=$DEPS" >> "$GITHUB_ENV"

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 \
            -DCMAKE_PREFIX_PATH="$OBS_DEPS" \
            -DENABLE_ZERO_COPY=ON -DENABLE_SW_DECODE=ON -DENABLE_CAMERA_CONTROL=ON

      - name: Configure (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          cmake -S . -B build -G "Unix Makefiles" \
            -DCMAKE_PREFIX_PATH="$OBS_DEPS" \
            -DENABLE_ZERO_COPY=ON -DENABLE_SW_DECODE=ON -DENABLE_CAMERA_CONTROL=ON

      - name: Configure (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cmake -S . -B build -G "Unix Makefiles" \
            -DENABLE_ZERO_COPY=ON -DENABLE_SW_DECODE=ON -DENABLE_CAMERA_CONTROL=ON

      - name: Build
        run: cmake --build build --config RelWithDebInfo -j

      - name: Package bundle (macOS)
        if: runner.os == 'macOS'
        run: cmake --install build --prefix "${{ runner.temp }}/install"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: obs-zcamera-${{ matrix.artifact }}
          path: |
            build/RelWithDebInfo/obs-zcamera.*
            build/ssp_connector/RelWithDebInfo/ssp-connector*
            build/**/*.dylib
            build/**/*.so
            ${{ runner.temp }}/install/**
          if-no-files-found: warn
